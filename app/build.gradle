plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}
def supabaseUrl = localProperties.getProperty("SUPABASE_URL", "")
def supabaseAnonKey = localProperties.getProperty(
        "SUPABASE_ANON_KEY",
        localProperties.getProperty("SUPABASE_PUBLISHABLE_KEY", "")
)
def backendBaseUrl = localProperties.getProperty(
        "BACKEND_BASE_URL",
        "http://sheetnews.ddns.net:3001"
)

android {
    namespace 'com.pleos.mobile_app_fuelog'
    compileSdk 36

    defaultConfig {
        applicationId "com.pleos.mobile_app_fuelog"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}